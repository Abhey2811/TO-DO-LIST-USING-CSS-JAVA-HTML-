<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive To-Do List</title>
  <!-- Google Fonts: Poppins (Bold & Modern) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 3D Animated Background Container -->
  <div id="vanta-bg"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <h1>WORKINGS FOR TODAY'S TASK </h1>
      <p class="subtitle">Stay organized and get things done</p>
    </header>

    <!-- Main Card -->
    <main class="todo-card">
      <!-- Input Section -->
      <form id="todo-form" class="todo-form">
        <label for="todo-input" class="sr-only">Add a new task</label>
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="What needs to be done?"
          autocomplete="off"
        />
        <button type="submit" id="add-btn" class="btn btn-primary" aria-label="Add task">
          Add
        </button>
      </form>

      <!-- Task List -->
      <ul id="todo-list" class="todo-list" aria-label="Task list">
        <!-- Tasks will be inserted here dynamically by JavaScript -->
      </ul>

      <!-- Footer Info -->
      <footer class="todo-footer">
        <span id="task-counter" class="task-counter">0 items left</span>
      </footer>
    </main>
  </div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <!-- Vanta Birds Library -->
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
  <!-- Vanta Birds Initialization -->
  <script>
    VANTA.BIRDS({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      backgroundColor: 0x07192f, // Midnight blue dark background
      color1: 0xff6b35,          // Bird wing color 1 (Vibrant Orange)
      color2: 0x3b82f6,          // Bird wing color 2 (Electric Blue)
      birdSize: 1.3,             // Size of birds
      wingSpan: 24.00,           // Wingspan
      speedLimit: 5.00,          // Flight speed
      separation: 25.00,
      alignment: 25.00,
      cohesion: 25.00,
      quantity: 4.00             // Flock density
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
